<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한수 v0.5 — 한 수 배우는 보드게임</title>
<style>
  :root { --bg1:#14161c; --card:#252a35; --line:#353b49; --txt:#e9ebf0; --sub:#9aa3b5; --acc:#e0a84a; --win:#2fbf71; --loss:#e5484d; --draw:#8b93a7; --blue:#4f8cff; }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; }
  body { font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif; background:radial-gradient(1200px 600px at 20% -10%, #2a2f3d 0%, var(--bg1) 60%); color:var(--txt); }
  button { font-family:inherit; cursor:pointer; border:none; border-radius:8px; padding:9px 12px; font-size:14px; background:#3a4152; color:#fff; transition:filter .15s, transform .05s; }
  button:hover:not(:disabled) { filter:brightness(1.18); }
  button:active:not(:disabled) { transform:translateY(1px); }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { background:var(--acc); color:#1a1306; font-weight:700; }
  button.green { background:#2f7a4a; } button.danger { background:#8f2f33; } button.ghost { background:transparent; border:1px solid var(--line); }
  select, input[type=text], input[type=password] { font-family:inherit; font-size:14px; padding:9px 11px; border-radius:8px; border:1px solid var(--line); background:#1a1e27; color:var(--txt); width:100%; }
  input:focus, select:focus { outline:2px solid rgba(224,168,74,.5); outline-offset:0; }
  label.l { display:block; font-size:12px; color:var(--sub); margin:9px 0 4px; }
  .hidden { display:none !important; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; }

  /* ---------- 로그인 ---------- */
  #auth { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .abox { width:min(400px,94vw); }
  .abox .logo { text-align:center; margin-bottom:18px; }
  .abox .logo .ic { font-size:40px; letter-spacing:4px; }
  .abox .logo h1 { margin:6px 0 2px; font-size:28px; } .abox .logo h1 span { color:var(--acc); }
  .abox .logo p { margin:0; color:var(--sub); font-size:13px; }
  .atabs { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:6px; }
  .atabs button { background:#1a1e27; color:var(--sub); border:1px solid var(--line); }
  .atabs button.on { background:var(--acc); color:#1a1306; border-color:var(--acc); font-weight:800; }
  .amsg { min-height:20px; font-size:13px; margin-top:10px; color:var(--loss); }
  .amsg.ok { color:var(--win); }
  .arule { font-size:11.5px; color:#7d8597; margin-top:3px; }
  .chk { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--sub); margin-top:10px; }
  .anote { font-size:11.5px; color:#6d7487; text-align:center; margin-top:14px; line-height:1.5; }

  /* ---------- 홈 ---------- */
  #home { max-width:1220px; margin:0 auto; padding:22px 18px 40px; }
  .hbar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .hbar h1 { margin:0; font-size:26px; } .hbar h1 span { color:var(--acc); } .hbar h1 small { font-size:12px; color:var(--sub); font-weight:500; margin-left:6px; }
  .who { display:flex; align-items:center; gap:10px; font-size:14px; }
  .who .av { width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,#e0a84a,#c26b2c); display:flex; align-items:center; justify-content:center; font-weight:900; color:#1a1306; }
  .who b { font-size:15px; } .who small { color:var(--sub); }
  .recTable { width:100%; border-collapse:collapse; font-size:13.5px; }
  .recTable th, .recTable td { padding:7px 8px; text-align:center; border-bottom:1px solid var(--line); }
  .recTable th { color:var(--sub); font-weight:600; font-size:12px; }
  .recTable td:first-child, .recTable th:first-child { text-align:left; }
  .w { color:var(--win); font-weight:700; } .lo { color:var(--loss); font-weight:700; } .d { color:var(--draw); font-weight:700; }
  .pbar { display:inline-block; width:70px; height:7px; border-radius:4px; background:#1a1e27; overflow:hidden; vertical-align:middle; margin-right:6px; }
  .pbar i { display:block; height:100%; background:var(--win); }
  .games { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:16px; }
  @media (max-width:1100px) { .games { grid-template-columns:repeat(2,1fr); } }
  @media (max-width:640px) { .games { grid-template-columns:1fr; } }
  .gcard { position:relative; overflow:hidden; display:flex; flex-direction:column; min-height:360px; }
  .gcard .icon { font-size:30px; line-height:1; } .gcard h3 { margin:6px 0 10px; font-size:19px; }
  .gcard .bg { position:absolute; right:-14px; top:-20px; font-size:110px; opacity:.06; pointer-events:none; }
  .mtabs { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; background:#1a1e27; padding:4px; border-radius:10px; }
  .mtabs button { padding:7px 0; font-size:12.5px; background:transparent; color:var(--sub); }
  .mtabs button.on { background:#3a4152; color:#fff; font-weight:800; }
  .mdesc { font-size:12.5px; color:#c6ccd8; margin:10px 0 2px; line-height:1.5; min-height:38px; }
  .lvl { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; }
  .lvl button { padding:6px 0; background:#1a1e27; border:1px solid var(--line); color:var(--sub); font-size:12.5px; }
  .lvl button.on { background:var(--acc); color:#1a1306; border-color:var(--acc); font-weight:800; }
  .opts { display:grid; grid-template-columns:1fr 1fr; gap:0 10px; }
  .tlist { list-style:none; margin:8px 0 0; padding:0; font-size:13px; }
  .tlist li { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:8px; cursor:pointer; }
  .tlist li:hover { background:#1a1e27; }
  .tlist li .ck { width:20px; height:20px; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:11px; flex:0 0 auto; }
  .tlist li.done .ck { background:var(--win); border-color:var(--win); color:#fff; }
  .tlist li.next { background:rgba(224,168,74,.12); }
  .gcard .spacer { flex:1; min-height:10px; }
  .gcard .start { width:100%; padding:12px; font-size:15px; margin-top:10px; }
  .tlvl { font-size:13px; margin-top:6px; } .tlvl b { color:var(--acc); font-size:16px; }
  .recent { margin-top:16px; }
  .recent h3 { margin:0 0 8px; font-size:16px; }
  .recent ul { list-style:none; margin:0; padding:0; max-height:260px; overflow:auto; }
  .recent li { display:flex; gap:9px; align-items:center; padding:7px 4px; border-bottom:1px solid var(--line); font-size:13px; }
  .badge { display:inline-block; min-width:44px; text-align:center; padding:2px 8px; border-radius:20px; font-weight:800; font-size:12px; }
  .badge.win { background:rgba(47,191,113,.18); color:var(--win); } .badge.loss { background:rgba(229,72,77,.18); color:var(--loss); } .badge.draw { background:rgba(139,147,167,.2); color:#c3c8d4; }
  .mbadge { font-size:11px; padding:2px 7px; border-radius:6px; background:#1a1e27; color:var(--sub); border:1px solid var(--line); min-width:52px; text-align:center; }
  .recent li .note { color:var(--sub); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .foot { margin-top:20px; color:#6d7487; font-size:12px; text-align:center; line-height:1.6; }

  /* ---------- 게임 ---------- */
  #game { display:flex; flex-direction:column; min-height:100vh; }
  .topbar { display:flex; align-items:center; gap:12px; padding:10px 16px; background:rgba(0,0,0,.25); border-bottom:1px solid var(--line); }
  .topbar .title { font-weight:800; font-size:17px; }
  .topbar .mode { font-size:12px; padding:3px 9px; border-radius:20px; background:var(--acc); color:#1a1306; font-weight:800; }
  .topbar .vs { color:var(--sub); font-size:14px; margin-left:auto; } .topbar .vs b { color:var(--txt); }
  .stage { display:flex; gap:18px; justify-content:center; align-items:flex-start; padding:16px; flex-wrap:wrap; }
  #boardHost { position:relative; }
  #boardHost svg, #boardHost canvas { display:block; border-radius:8px; box-shadow:0 12px 34px rgba(0,0,0,.55); }
  .panel { width:340px; display:flex; flex-direction:column; gap:10px; }
  #gStatus { padding:12px 14px; border-radius:10px; background:#1a1e27; border:1px solid var(--line); font-weight:800; font-size:16px; min-height:48px; display:flex; align-items:center; gap:8px; }
  #gStatus.me { border-color:var(--acc); box-shadow:0 0 0 1px var(--acc) inset; }
  #gStatus.alert { background:#3a1517; border-color:var(--loss); color:#ffb4b6; }
  #gStatus.think { color:var(--sub); }
  .dots::after { content:''; animation:dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content:''; } 25% { content:'.'; } 50% { content:'..'; } 75% { content:'...'; } }
  #gProg { height:4px; border-radius:2px; background:#1a1e27; overflow:hidden; }
  #gProg div { height:100%; width:0; background:var(--acc); }
  #gLesson:empty, #gExtra:empty, #gCoach:empty { display:none; }
  .lesson { background:linear-gradient(135deg,#2a3142,#252a35); border:1px solid #47506a; border-radius:12px; padding:14px; font-size:14px; line-height:1.6; }
  .lesson .lt { font-size:12px; color:var(--acc); font-weight:800; margin-bottom:2px; }
  .lesson h4 { margin:0 0 6px; font-size:17px; }
  .lesson .task { margin-top:8px; padding:8px 10px; border-radius:8px; background:rgba(224,168,74,.14); border:1px solid rgba(224,168,74,.4); font-weight:700; }
  .coach { border-radius:12px; padding:11px 13px; font-size:13.5px; line-height:1.6; background:rgba(79,140,255,.12); border:1px solid rgba(79,140,255,.45); }
  .coach .ct { font-size:12px; font-weight:800; color:#8db4ff; margin-bottom:2px; }
  #gInfo { font-size:12px; color:var(--sub); min-height:16px; }
  #gBtns { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  #gLog { height:150px; overflow:auto; background:#1a1e27; border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:13px; line-height:1.65; font-family:Consolas,"D2Coding",monospace; }
  #gLog .me { color:#ffd58a; } #gLog .ai { color:#9ec5ff; } #gLog .sys { color:var(--sub); }
  .tray { display:flex; flex-wrap:wrap; gap:3px; min-height:26px; align-items:center; font-size:12px; color:var(--sub); }
  .tray .pc { display:inline-flex; width:24px; height:24px; border-radius:50%; align-items:center; justify-content:center; font-weight:800; font-size:13px; background:#f3e3bf; }
  .bars { display:flex; flex-direction:column; gap:3px; }
  .wr { height:14px; border-radius:7px; overflow:hidden; display:flex; border:1px solid var(--line); }
  .wr .a { background:linear-gradient(90deg,#f0c060,#e0a84a); transition:width .5s; } .wr .b { background:#3b4256; flex:1; }
  .wrl { display:flex; justify-content:space-between; font-size:11px; color:var(--sub); }

  #toast { position:absolute; left:50%; top:42%; transform:translate(-50%,-50%); pointer-events:none; z-index:20; text-align:center; }
  .tst { padding:14px 24px; border-radius:14px; font-size:26px; font-weight:900; letter-spacing:-.5px; white-space:nowrap; box-shadow:0 10px 30px rgba(0,0,0,.45); animation:pop 1.7s ease forwards; }
  .tst small { display:block; font-size:14px; font-weight:600; opacity:.85; margin-top:2px; }
  .tst.good { background:linear-gradient(135deg,#1f9d5c,#2fbf71); color:#fff; }
  .tst.bad { background:linear-gradient(135deg,#b3262b,#e5484d); color:#fff; }
  .tst.warn { background:linear-gradient(135deg,#d97706,#f59e0b); color:#1a1306; }
  .tst.info { background:rgba(20,22,28,.9); color:#fff; border:1px solid var(--line); }
  @keyframes pop { 0% { opacity:0; transform:scale(.6); } 12% { opacity:1; transform:scale(1.08); } 20% { transform:scale(1); } 80% { opacity:1; } 100% { opacity:0; transform:translateY(-24px); } }

  .overlay { position:fixed; inset:0; background:rgba(5,6,10,.72); display:flex; align-items:center; justify-content:center; z-index:50; backdrop-filter:blur(3px); }
  .rbox { width:min(520px,92vw); background:var(--card); border:1px solid var(--line); border-radius:18px; padding:24px 24px 18px; text-align:center; box-shadow:0 24px 60px rgba(0,0,0,.6); animation:rin .45s cubic-bezier(.2,1.4,.4,1); max-height:94vh; overflow:auto; }
  @keyframes rin { from { transform:scale(.7); opacity:0; } to { transform:scale(1); opacity:1; } }
  .rbig { font-size:60px; font-weight:900; letter-spacing:-2px; line-height:1.05; }
  .rbig.win { color:var(--win); text-shadow:0 0 30px rgba(47,191,113,.45); }
  .rbig.loss { color:var(--loss); text-shadow:0 0 30px rgba(229,72,77,.4); }
  .rbig.draw { color:#c3c8d4; }
  .remoji { font-size:46px; }
  .rreason { color:var(--sub); margin:6px 0 12px; font-size:15px; }
  .rfeed { text-align:left; background:#1a1e27; border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-size:14px; line-height:1.65; }
  .rfeed h4 { margin:0 0 4px; font-size:13px; color:var(--acc); }
  .rfeed ul { margin:4px 0 0; padding-left:18px; }
  .rrec { margin:12px 0 4px; font-size:14px; color:var(--sub); }
  .rsug { margin-top:10px; padding:10px 12px; border-radius:10px; font-size:14px; background:rgba(224,168,74,.12); border:1px solid rgba(224,168,74,.4); }
  .rbtns { display:flex; gap:8px; margin-top:14px; } .rbtns button { flex:1; padding:12px; font-size:15px; }
  .mbox { width:min(400px,90vw); background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; text-align:center; animation:rin .3s ease; }
  .mbox .mt { font-size:18px; font-weight:800; margin-bottom:6px; } .mbox .ms { color:#c6ccd8; font-size:14px; margin-bottom:16px; line-height:1.55; }
  .mbox .rbtns button { padding:11px; }
  #promo { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.45); z-index:30; border-radius:8px; }
  #promo .pbox { background:var(--card); padding:14px; border-radius:12px; display:flex; gap:8px; }
  #promo button { font-size:40px; width:70px; height:70px; padding:0; background:#f0d9b5; color:#222; }

  .uisel { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .uisel label { display:flex; gap:6px; align-items:flex-start; padding:8px; border:1px solid var(--line); border-radius:8px; cursor:pointer; font-size:13px; }
  .uisel small { display:block; color:var(--sub); font-size:11px; margin-top:2px; }
  .uisel input { margin-top:3px; }
  .stylebox { margin-top:16px; } .stylebox h3 { margin:0 0 10px; font-size:16px; } .stylebox h3 small { font-size:12px; color:var(--sub); font-weight:500; margin-left:6px; }
  .sgrid4 { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  @media (max-width:1000px) { .sgrid4 { grid-template-columns:repeat(2,1fr); } }
  .scard { background:#1a1e27; border:1px solid var(--line); border-radius:12px; padding:12px; font-size:13px; line-height:1.55; }
  .scard h4 { margin:0 0 6px; font-size:14px; }
  .chip { display:inline-block; padding:3px 9px; border-radius:20px; font-size:12px; font-weight:800; margin:0 4px 4px 0; background:rgba(224,168,74,.16); color:var(--acc); border:1px solid rgba(224,168,74,.35); }
  .scard .ev { color:var(--sub); font-size:11.5px; margin-top:6px; }
  .adapt { background:#1a1e27; border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:13px; }
  .adapt .adbar { height:8px; border-radius:4px; background:#2c3242; overflow:hidden; margin-top:6px; }
  .adapt .adbar i { display:block; height:100%; background:linear-gradient(90deg,#2fbf71,#e0a84a,#e5484d); transition:width .5s; }

  /* ===================== 어린이 화면 ===================== */
  body.kid { --card:#ffffff; --line:#ffd9a8; --txt:#2b2d42; --sub:#7a6f63; --acc:#ff8a1f; --win:#21a45c; --loss:#ef4444;
    background:linear-gradient(160deg,#fff4d6 0%,#ffe6f0 45%,#dff1ff 100%); font-size:16px; }
  body.kid .card { border-radius:22px; border-width:2px; box-shadow:0 6px 0 rgba(255,170,90,.25); }
  body.kid button { border-radius:14px; font-size:15px; padding:11px 14px; background:#8ec5ff; color:#12304d; font-weight:700; }
  body.kid button.primary { background:#ff8a1f; color:#fff; box-shadow:0 4px 0 #d86a00; }
  body.kid button.green { background:#3ccf7e; color:#fff; box-shadow:0 4px 0 #23a35d; }
  body.kid button.danger { background:#ff6b6b; color:#fff; }
  body.kid button.ghost { background:#fff; border:2px solid var(--line); color:var(--txt); }
  body.kid select, body.kid input[type=text], body.kid input[type=password] { background:#fffaf2; color:var(--txt); border:2px solid var(--line); border-radius:12px; }
  body.kid .hbar h1 { font-size:34px; } body.kid .hbar h1 span { color:#ff8a1f; }
  body.kid .gcard h3 { font-size:24px; } body.kid .gcard .icon { font-size:40px; }
  body.kid .mtabs { background:#fff1dc; border-radius:16px; } body.kid .mtabs button { background:transparent; color:#a0723f; box-shadow:none; font-size:13px; padding:8px 0; white-space:nowrap; }
  body.kid .mtabs button.on { background:#ff8a1f; color:#fff; }
  body.kid .mdesc { color:#5b5146; font-size:14px; }
  body.kid .lvl button { background:#fffaf2; border:2px solid var(--line); color:#a0723f; box-shadow:none; padding:7px 0; }
  body.kid .lvl button.on { background:#ff8a1f; color:#fff; border-color:#ff8a1f; }
  body.kid .tlist li { font-size:15px; } body.kid .tlist li:hover, body.kid .tlist li.next { background:#fff1dc; }
  body.kid .recTable th, body.kid .recTable td { border-color:#ffe3c2; }
  body.kid .pbar, body.kid .adapt .adbar { background:#ffe8cc; }
  body.kid .scard, body.kid .adapt { background:#fffaf2; border:2px solid var(--line); }
  body.kid .chip { background:#ffe8cc; color:#c25e00; border-color:#ffc58a; font-size:13px; }
  body.kid .topbar { background:rgba(255,255,255,.7); border-color:var(--line); }
  body.kid #gStatus { background:#fff; border:2px solid var(--line); font-size:19px; color:var(--txt); }
  body.kid #gStatus.me { border-color:#ff8a1f; box-shadow:0 0 0 2px #ffcf99 inset; }
  body.kid #gStatus.alert { background:#ffe4e4; color:#b42318; }
  body.kid #gLog, body.kid #gInfo, body.kid .bars, body.kid .mbadge { display:none !important; }
  body.kid .lesson { background:#fff; border:2px solid #ffc58a; color:var(--txt); font-size:16px; }
  body.kid .lesson .task { background:#fff1dc; border-color:#ffc58a; }
  body.kid .coach { background:#eaf5ff; border:2px solid #9ccfff; font-size:15px; color:#173a5e; }
  body.kid .coach .ct { color:#1f6fd1; font-size:14px; }
  body.kid .rbox, body.kid .mbox { background:#fff; border:3px solid #ffc58a; color:var(--txt); }
  body.kid .rfeed { background:#fffaf2; border:2px solid var(--line); font-size:16px; }
  body.kid .rfeed h4 { color:#ff8a1f; font-size:15px; }
  body.kid .mbox .ms { color:#5b5146; font-size:16px; }
  body.kid .tray .pc { background:#fff3dd; } body.kid .wrl { color:#7a6f63; }
  body.kid .npad button { background:#ffe8cc; color:#7a3d00; box-shadow:none; }
  body.kid .tog button { background:#eaf5ff; color:#173a5e; } body.kid .tog button.on { background:#ff8a1f; color:#fff; }
  body.kid .badge.loss { background:#ffe4e4; } body.kid .badge.win { background:#dcf7e8; }
  body.kid .stars { font-size:34px; letter-spacing:4px; margin:4px 0 2px; }
  .who { flex-wrap:wrap; }
  .bknote { display:flex; align-items:center; gap:10px; justify-content:space-between; padding:10px 14px; margin-bottom:12px; border-radius:12px; font-size:13.5px; background:rgba(79,140,255,.12); border:1px solid rgba(79,140,255,.45); }
  body.kid .bknote { background:#eaf5ff; border:2px solid #9ccfff; color:#173a5e; }
  .rsum { text-align:left; background:#1a1e27; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:13px; line-height:1.6; margin-bottom:10px; }
  body.kid .rsum { background:#fffaf2; border:2px solid var(--line); }
  .rsum b { color:var(--acc); }
  #confetti { position:fixed; inset:0; pointer-events:none; z-index:60; }

  .sgrid { display:grid; background:#2b3140; padding:4px; border-radius:10px; box-shadow:0 12px 34px rgba(0,0,0,.55); user-select:none; }
  .scell { background:#f7f3ea; color:#1d2433; display:flex; align-items:center; justify-content:center; font-weight:700; cursor:pointer; position:relative; transition:background .12s; }
  .scell.given { color:#111; background:#e9e2d2; }
  .scell.user { color:#1f5fd1; }

// ---------- 안전한 저장소 (막혀 있으면 메모리로 대체) ----------
const SafeStore = (() => {
  const mem = {};
  function test(kind) { try { const s = window[kind], k = '__t'; s.setItem(k, '1'); s.removeItem(k); return s; } catch (e) { return null; } }
  const local = test('localStorage'), sess = test('sessionStorage');
  const wrap = s => ({ get: k => { try { return s ? s.getItem(k) : (k in mem ? mem[k] : null); } catch (e) { return mem[k] || null; } },
    set: (k, v) => { try { if (s) s.setItem(k, v); else mem[k] = v; return true; } catch (e) { mem[k] = v; return false; } },
    del: k => { try { if (s) s.removeItem(k); } catch (e) {} delete mem[k]; } });
  return { local: wrap(local), sess: wrap(sess), persistent: !!local };
})();

// ---------- 저장소 ----------
const Store = {
  KEY: 'boardArena.v3', data: null,
  load() {
    try { this.data = JSON.parse(SafeStore.local.get(this.KEY)) || null; } catch (e) { this.data = null; }
    if (!this.data || !this.data.users) this.data = { users: {}, session: null, fails: {} };
    this.data.fails = this.data.fails || {};
    Object.values(this.data.users).forEach(u => this.migrate(u));
  },
  migrate(u) {
    u.prefs = u.prefs || {}; u.prefs.match = u.prefs.match || {}; u.prefs.train = u.prefs.train || {};
    u.stats = u.stats || {}; u.tut = u.tut || {}; u.log = u.log || []; u.style = u.style || {};
    if (!u.prefs.ui) u.prefs.ui = 'normal';
    GAMES.forEach(g => {
      if (!u.prefs.match[g]) u.prefs.match[g] = g === 'sudoku' ? 3 : 2;
      if (!u.prefs.train[g]) u.prefs.train[g] = 1;
      u.stats[g] = u.stats[g] || {};
      u.stats[g].match = u.stats[g].match || { w: 0, l: 0, d: 0, best: 0 };
      u.stats[g].train = u.stats[g].train || { w: 0, l: 0, d: 0 };
      u.tut[g] = u.tut[g] || [];
    });
  },
  save() { try { return SafeStore.local.set(this.KEY, JSON.stringify(this.data)); } catch (e) { return false; } },
  sessionId() { return SafeStore.sess.get('boardArena.session') || this.data.session; },
  setSession(id, keep) { if (keep) this.data.session = id; else { this.data.session = null; SafeStore.sess.set('boardArena.session', id); } this.save(); },
  clearSession() { this.data.session = null; SafeStore.sess.del('boardArena.session'); this.save(); },
  cur() { const id = this.sessionId(); return id && this.data.users[id] ? this.data.users[id] : null; },
  record(game, mode, result, entry) {
    const u = this.cur(); if (!u) return null;
    const s = u.stats[game][mode], k = result === 'win' ? 'w' : result === 'loss' ? 'l' : 'd';
    s[k]++;
    if (mode === 'match' && result === 'win' && entry.level > (s.best || 0)) s.best = entry.level;
    u.log.unshift(Object.assign({ game, mode, result, date: Date.now() }, entry));
    if (u.log.length > 300) u.log.length = 300;
    this.save();
    return s;
  },
  recent(game, mode, level, n) { const u = this.cur(); if (!u) return []; return u.log.filter(e => e.game === game && e.mode === mode && e.level === level).slice(0, n).map(e => e.result); }
};

// ---------- 순수 JS SHA-256 · HMAC · PBKDF2 (WebCrypto가 막힌 환경용, 결과는 동일) ----------
const toHex = a => Array.from(a).map(b => b.toString(16).padStart(2, '0')).join('');
const _K = new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
function sha256(msg) {
  const l = msg.length, nb = ((l + 9 + 63) >> 6) << 6, m = new Uint8Array(nb); m.set(msg); m[l] = 0x80;
  const bl = l * 8; m[nb - 4] = bl >>> 24; m[nb - 3] = bl >>> 16; m[nb - 2] = bl >>> 8; m[nb - 1] = bl;
  m[nb - 5] = Math.floor(bl / 4294967296);
  const H = new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]), W = new Uint32Array(64);
  for (let o = 0; o < nb; o += 64) {
    for (let i = 0; i < 16; i++) W[i] = (m[o + i * 4] << 24) | (m[o + i * 4 + 1] << 16) | (m[o + i * 4 + 2] << 8) | m[o + i * 4 + 3];
    for (let i = 16; i < 64; i++) { const a = W[i - 15], b = W[i - 2]; W[i] = (((a >>> 7 | a << 25) ^ (a >>> 18 | a << 14) ^ (a >>> 3)) + W[i - 7] + ((b >>> 17 | b << 15) ^ (b >>> 19 | b << 13) ^ (b >>> 10)) + W[i - 16]) | 0; }
    let a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
    for (let i = 0; i < 64; i++) {
      const t1 = (h + ((e >>> 6 | e << 26) ^ (e >>> 11 | e << 21) ^ (e >>> 25 | e << 7)) + ((e & f) ^ (~e & g)) + _K[i] + W[i]) | 0;
      const t2 = (((a >>> 2 | a << 30) ^ (a >>> 13 | a << 19) ^ (a >>> 22 | a << 10)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H[0] += a; H[1] += b; H[2] += c; H[3] += d; H[4] += e; H[5] += f; H[6] += g; H[7] += h;
  }
  const out = new Uint8Array(32); for (let i = 0; i < 8; i++) { out[i * 4] = H[i] >>> 24; out[i * 4 + 1] = H[i] >>> 16; out[i * 4 + 2] = H[i] >>> 8; out[i * 4 + 3] = H[i]; }

}

function pbkdf2Sha256(pw, salt, iter) {

  for (let i = 1; i < iter; i++) { u = hmacSha256(pw, u); for (let j = 0; j < 32; j++) t[j] ^= u[j]; }
  return t;

// ---------- 계정 (비밀번호는 PBKDF2로 해시해서 저장) ----------
const Auth = {
  async hash(pw, saltHex) {
    const salt = new Uint8Array(saltHex.match(/../g).map(h => parseInt(h, 16)));
    const pwb = new TextEncoder().encode(pw);
    try {
      if (window.crypto && crypto.subtle) {
        const key = await crypto.subtle.importKey('raw', pwb, 'PBKDF2', false, ['deriveBits']);
        const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: 150000, hash: 'SHA-256' }, key, 256);
        return toHex(new Uint8Array(bits));
      }
    } catch (e) { /* 아래 대체 경로 사용 */ }
    await new Promise(r => setTimeout(r, 20));
    return toHex(pbkdf2Sha256(pwb, salt, 150000));
  },
  salt() {
    const a = new Uint8Array(16);
    try { crypto.getRandomValues(a); } catch (e) { for (let i = 0; i < 16; i++) a[i] = (Math.random() * 256) | 0; }
    return toHex(a);
  },
  msg(t, ok) { const m = $('aMsg'); m.textContent = t; m.className = 'amsg' + (ok ? ' ok' : ''); },
  tab(which) {
    $('tabLogin').classList.toggle('on', which === 'login'); $('tabSignup').classList.toggle('on', which === 'signup');
    $('fLogin').classList.toggle('hidden', which !== 'login'); $('fSignup').classList.toggle('hidden', which !== 'signup');
    this.msg(''); (which === 'login' ? $('liId') : $('suId')).focus();
  },
  init() {
    $('tabLogin').onclick = () => this.tab('login');
    $('tabSignup').onclick = () => this.tab('signup');
    $('fSignup').onsubmit = e => { e.preventDefault(); this.signup(); };
    $('fLogin').onsubmit = e => { e.preventDefault(); this.login(); };
    $('btnUi').onclick = async () => {
      const u = Store.cur(); if (!u) return;
      const toKid = u.prefs.ui !== 'kid';
      if (await Modal.ask('화면 스타일 바꾸기', toKid ? '🧸 <b>어린이용</b> 화면으로 바꿀까요?<br>큰 글씨, 쉬운 말, 칭찬 중심으로 보여줘요.' : '🎯 <b>일반</b> 화면으로 바꿀까요?<br>자세한 기록과 분석이 보여요.', '바꾸기')) {
        u.prefs.ui = toKid ? 'kid' : 'normal'; Store.save(); App.show();
      }
    };
    $('btnBackup').onclick = () => Backup.export();
    $('btnRestore').onclick = () => Backup.pick();
    $('btnRestoreA').onclick = () => Backup.pick();
    $('bkFile').onchange = e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) Backup.read(f); };
    $('btnLogout').onclick = async () => { if (await Modal.ask('로그아웃할까요?', '', '로그아웃')) { Store.clearSession(); App.show(); } };
  },
  async signup() {
    const id = $('suId').value.trim(), pw = $('suPw').value, pw2 = $('suPw2').value, nick = $('suNick').value.trim();
    if (!/^[A-Za-z0-9]{4,16}$/.test(id)) return this.msg('아이디는 영문·숫자 4~16자로 만들어 주세요.');
    if (pw.length < 6) return this.msg('비밀번호는 6자 이상이어야 해요.');
    if (pw !== pw2) return this.msg('비밀번호 확인이 일치하지 않아요.');
    if (!nick || nick.length > 12) return this.msg('닉네임을 1~12자로 입력해 주세요.');
    this.msg('계정을 만드는 중...', true);
    const key = id.toLowerCase();
    if (Store.data.users[key]) return this.msg('이미 사용 중인 아이디예요.');
    try {
      const salt = this.salt(), hash = await this.hash(pw, salt);

    const u = Store.data.users[id];

  }
};

// ---------- 백업 / 복원 ----------
const Backup = {
  VER: 1, MAX: 5 * 1024 * 1024,
  stamp(d) { const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`; },
  games(u) { return GAMES.reduce((a, g) => { const s = u.stats[g]; return a + s.match.w + s.match.l + s.match.d + s.train.w + s.train.l + s.train.d; }, 0); },
  summary(u) {
    const tut = GAMES.reduce((a, g) => a + (u.tut[g] || []).length, 0);
    const last = u.log && u.log[0] ? new Date(u.log[0].date) : null;
    return `아이디 <b>@${esc(u.id)}</b> · 닉네임 <b>${esc(u.nick)}</b><br>대국·퍼즐 <b>${this.games(u)}판</b> · 튜토리얼 <b>${tut}개</b> 완료<br>마지막 기록: ${last ? last.toLocaleString('ko-KR') : '없음'}`;
  },
  export() {
    const u = Store.cur(); if (!u) return;
    const now = new Date();
    const data = { app: 'hansu', kind: 'backup', ver: this.VER, exported: now.toISOString(), user: JSON.parse(JSON.stringify(u)) };
    try {
      const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = `hansu_${u.id}_${this.stamp(now)}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      u.lastBackup = Date.now(); Store.save(); Home.render();
      Modal.ask('💾 백업 파일을 저장했어요', `파일 이름: <b>${esc(a.download)}</b><br>다운로드 폴더를 확인해 주세요.<br><br>다른 PC·브라우저나 새 버전에서 <b>📂 불러오기</b>로 이어서 할 수 있어요.`, '확인', false, true);
    } catch (e) { console.error(e); Modal.ask('백업에 실패했어요', esc(e && e.message || e), '확인', false, true); }
  },
  notice(u) {
    const el = $('bkNotice'); if (!el) return;
    const n = this.games(u), old = !u.lastBackup || Date.now() - u.lastBackup > 7 * 864e5;
    if (n >= 3 && old) {
      el.innerHTML = `<div class="bknote"><span>💾 ${u.lastBackup ? '마지막 백업이 일주일 넘었어요.' : '아직 백업한 적이 없어요.'} 기록을 잃지 않게 백업해 두세요.</span><button class="primary" id="bkNow">지금 백업</button></div>`;
      $('bkNow').onclick = () => this.export();
    } else el.innerHTML = '';
  },
  pick() { $('bkFile').click(); },
  validate(d) {
    if (!d || d.app !== 'hansu' || d.kind !== 'backup' || !d.user) throw new Error('한수 백업 파일이 아니에요.');
    if (d.ver > this.VER) throw new Error('더 새로운 버전의 한수에서 만든 백업이에요. 최신 버전에서 불러와 주세요.');
    const u = d.user;
    if (typeof u.id !== 'string' || !/^[A-Za-z0-9]{4,16}$/.test(u.id)) throw new Error('아이디 정보가 올바르지 않아요.');
    if (typeof u.nick !== 'string' || !u.nick.trim()) u.nick = u.id;
    u.nick = u.nick.slice(0, 12);
    const hex = /^[0-9a-f]+$/;
    if (!(typeof u.salt === 'string' && hex.test(u.salt) && typeof u.hash === 'string' && hex.test(u.hash))) { u.salt = null; u.hash = null; }
    if (u.log && !Array.isArray(u.log)) u.log = [];
    if (u.prefs && u.prefs.ui !== 'kid') u.prefs.ui = 'normal';
    return u;
  },
  read(file) {
    if (file.size > this.MAX) { Modal.ask('불러올 수 없어요', '파일이 너무 커요. 한수 백업 파일이 맞는지 확인해 주세요.', '확인', false, true); return; }
    const r = new FileReader();
    r.onerror = () => Modal.ask('불러올 수 없어요', '파일을 읽지 못했어요.', '확인', false, true);
    r.onload = () => {

// ---------- 확인창 ----------
const Modal = {
  ask(title, sub, okLabel, danger, alertOnly, cancelLabel) {
    return new Promise(resolve => {
      const m = $('modal');
      m.innerHTML = `<div class="mbox"><div class="mt">${title}</div><div class="ms">${sub || ''}</div>
        <div class="rbtns">${alertOnly ? '' : `<button id="mNo">${cancelLabel || '취소'}</button>`}<button id="mYes" class="${danger ? 'danger' : 'primary'}">${okLabel || '확인'}</button></div></div>`;
      m.classList.remove('hidden');
      const done = v => { m.classList.add('hidden'); m.innerHTML = ''; document.removeEventListener('keydown', key); resolve(v); };
      const key = e => { if (e.key === 'Escape') done(false); if (e.key === 'Enter') { e.preventDefault(); done(true); } };
      document.addEventListener('keydown', key);
      $('mYes').onclick = () => done(true);
      if (!alertOnly) $('mNo').onclick = () => done(false);
      m.onclick = e => { if (e.target === m) done(false); };
      setTimeout(() => $('mYes') && $('mYes').focus(), 30);
    });
  }
};
const confirmResign = () => Modal.ask('기권할까요?', '이 판은 패배로 기록돼요.', '기권하기', true);

  close() {

  },
  moveCount() { return this.active && this.active.moveCount ? this.active.moveCount() : 0; },
  status(html, cls) { const s = $('gStatus'); s.className = cls || ''; s.innerHTML = html; },
  info(t) { $('gInfo').innerHTML = t; },
  coach(html) { $('gCoach').innerHTML = html ? `<div class="coach"><div class="ct">${isKid() ? '🐯 호돌 선생님' : '🧑‍🏫 코치'}</div>${html}</div>` : ''; },
  log(html, cls) { const d = document.createElement('div'); d.className = cls || ''; d.innerHTML = html; $('gLog').appendChild(d); $('gLog').scrollTop = 1e9; },
  buttons(list) {
    const box = $('gBtns'); box.innerHTML = '';
    list.filter(Boolean).forEach(b => { const e = document.createElement('button'); e.textContent = b.label; e.id = b.id; if (b.cls) e.className = b.cls; e.onclick = b.on; box.appendChild(e); });
  },
  toast(main, sub, kind) {
    const t = $('toast'); t.innerHTML = `<div class="tst ${kind || 'info'}">${main}${sub ? `<small>${sub}</small>` : ''}</div>`;
    clearTimeout(this._tt); this._tt = setTimeout(() => { t.innerHTML = ''; }, 1750);
  },
  // 대국 종료 → 기록 → 피드백 → 결과 화면 (저장이 실패해도 결과는 반드시 표시)
  finish(result, reason, fb) {
    if (this.ended) return;
    this.ended = true; stopProg();
    const g = this.game, lv = this.opts.level, mode = this.mode, u = Store.cur();
    let stats = null, feed = '', sug = '', nextTrain = null;
    try { if (fb.style && mode !== 'tutorial') Style.add(g, fb.style); } catch (e) { console.error(e); }
    try { stats = Store.record(g, mode, result, { level: lv, endLevel: fb.endLevel || lv, reason, moves: fb.moves || 0, hints: fb.hints || 0, warns: fb.warns || 0 }); } catch (e) { console.error(e); }
    if (mode === 'train') {
      const t = u.prefs.train[g];
      if (fb.lvf !== undefined) nextTrain = Math.max(1, Math.min(10, Math.round(fb.lvf + (result === 'win' ? 0.5 : result === 'loss' ? -0.5 : 0))));
      else nextTrain = result === 'win' ? Math.min(10, lv + 1) : result === 'loss' ? Math.max(1, lv - 1) : lv;
      u.prefs.train[g] = nextTrain; Store.save();
    }
    try { feed = Feedback.make(g, mode, result, reason, fb, nextTrain); } catch (e) { console.error(e); feed = '<div>피드백을 만드는 중 문제가 생겼어요.</div>'; }
    this._sugLv = null;
    if (mode === 'match') {
      const rec = Store.recent(g, 'match', lv, 3);
      if (rec.length === 3 && rec.every(r => r === 'win') && lv < 10) { this._sugLv = lv + 1; sug = `<div class="rsug">🔥 Lv.${lv}에서 3연속 ${g === 'sudoku' ? '완성' : '승리'}! 한 단계 올려볼까요?</div>`; }
      else if (rec.length === 3 && rec.every(r => r === 'loss') && lv > 1) { this._sugLv = lv - 1; sug = `<div class="rsug">💪 Lv.${lv}가 조금 어려운 것 같아요. 교육 모드에서 연습하거나 한 단계 낮춰 볼까요?</div>`; }
    }
    const emoji = result === 'win' ? '🏆' : result === 'loss' ? (g === 'sudoku' ? '🧩' : '😤') : '🤝';

// ---------- 진행 막대 · 워커 ----------
let _prog = null;
function startProg(ms) {
  const bar = $('gProg').firstElementChild, t0 = Date.now();
  clearInterval(_prog);
  _prog = setInterval(() => { bar.style.width = Math.min(100, (Date.now() - t0) / ms * 100) + '%'; }, 80);
}
function stopProg() { clearInterval(_prog); const b = $('gProg') && $('gProg').firstElementChild; if (b) b.style.width = '0'; }
function makeWorker(tagId) { try { return new Worker(URL.createObjectURL(new Blob([$(tagId).textContent], { type: 'text/javascript' }))); } catch (e) { return null; } }
function engineCall(ctx, msg, fallback, timeMs, minMs) {
  return new Promise(resolve => {
    const id = ++ctx.reqId, t0 = Date.now();
    let done = false;
    const finish = r => {
      if (done) return; done = true;
      const wait = Math.max(0, (minMs || 0) - (Date.now() - t0));
      setTimeout(() => { stopProg(); resolve(id === ctx.reqId ? r : null); }, wait);
    };
    startProg(Math.max(timeMs > 6000 ? timeMs : 1500, minMs || 0));
    if (!ctx.worker) { setTimeout(() => finish(fallback()), 40); return; }
    ctx.worker.onmessage = e => { if (e.data.id === id) finish(e.data.res); };
    ctx.worker.onerror = e => { e.preventDefault && e.preventDefault(); ctx.worker = null; setTimeout(() => finish(fallback()), 10); };
    ctx.worker.postMessage(Object.assign({ id }, msg));
    setTimeout(() => { if (!done && id === ctx.reqId) { try { ctx.worker.terminate(); } catch (e) {} ctx.worker = null; finish(fallback()); } }, timeMs + 10000);
  });
}
// ---------- 교육 모드: 대국 중 실력에 맞춰 AI 레벨 조절 ----------
// 사람이 둔 수마다 품질(좋음/보통/아쉬움/큰 실수)을 매겨 레벨 값을 올리고 내림
const Adapt = {
  STEP: { good: 0.34, ok: 0, slip: -0.4, blunder: -0.8 },
  init(G, base) { G.lvf = base; G.lvNow = base; G.lvPath = [base]; G.quality = { good: 0, ok: 0, slip: 0, blunder: 0 }; G.hintThisTurn = false; },
  classify(loss, th) { if (loss <= th[0]) return 'good'; if (loss <= th[1]) return 'ok'; if (loss <= th[2]) return 'slip'; return 'blunder'; },
  step(G, q) {
    if (!G || G.mode !== 'train' || !q) return;
    G.quality[q]++;
    let d = this.STEP[q];
    if (q === 'good' && G.hintThisTurn) d = 0;          // 힌트로 찾은 좋은 수는 레벨을 올리지 않음
    G.hintThisTurn = false;
    G.lvf = Math.max(1, Math.min(10, G.lvf + d));
    const nl = Math.round(G.lvf);
    if (nl !== G.lvNow) {
      const up = nl > G.lvNow; G.lvNow = nl; G.lvPath.push(nl);
      if (isKid()) Shell.toast(up ? `AI가 더 세졌어! ⬆` : `AI가 조금 쉬워졌어 ⬇`, up ? '네가 잘하고 있어서 그래!' : '천천히 해 보자', up ? 'good' : 'info');
      else Shell.toast(`AI 레벨 ${up ? '⬆' : '⬇'} Lv.${nl}`, up ? '좋은 수가 이어져서 더 세게 둘게요' : '조금 쉽게 둘게요', up ? 'good' : 'info');
      Shell.log(`· AI 레벨 ${up ? '상승' : '하락'} → Lv.${nl}`, 'sys');
    }
    this.paint(G);
  },
  html(G) { return `<div class="adapt"><div class="wrl"><span>🎚️ AI 레벨 <b id="adLv" style="color:var(--acc);font-size:15px">Lv.${G.lvNow}</b></span><span id="adQ"></span></div><div class="adbar"><i id="adBar" style="width:${(G.lvf - 1) / 9 * 100}%"></i></div><div class="wrl" style="margin-top:3px"><span>내 수를 보고 대국 중에 조절돼요</span><span>Lv.10</span></div></div>`; },
  paint(G) {
    const e = $('adLv'); if (!e) return;
    const u = Store.cur(); if (u && G.game !== 'sudoku') $('gVs').innerHTML = `<b>${esc(u.nick)}</b> vs <b>AI Lv.${G.lvNow}</b>`;
    e.textContent = `Lv.${G.lvNow}`; $('adBar').style.width = ((G.lvf - 1) / 9 * 100) + '%';
    const q = G.quality; $('adQ').textContent = `👍${q.good} · 😐${q.ok} · ⚠️${q.slip + q.blunder}`;
  }
};

// ---------- 기풍 · 성향 분석 ----------
const Style = {
  MIN: 3,
  add(g, st) {
    const u = Store.cur(); if (!u) return;
    const a = u.style[g] || (u.style[g] = { games: 0 });
    a.games++;
    Object.keys(st).forEach(k => {
      const v = st[k];
      if (typeof v === 'number') a[k] = (a[k] || 0) + v;
      else if (v && typeof v === 'object') { a[k] = a[k] || {}; Object.keys(v).forEach(kk => a[k][kk] = (a[k][kk] || 0) + v[kk]); }
    });
    Store.save();
  },
  top(obj, names) { let best = null, bv = 0; Object.keys(obj || {}).forEach(k => { if (obj[k] > bv && names[k]) { bv = obj[k]; best = k; } }); return best ? names[best] : null; },
  speed(a) { const t = a.thinkN ? a.think / a.thinkN : 0; return t < 4 ? ['⚡ 속공형', `한 수 평균 ${t.toFixed(1)}초`] : t > 15 ? ['🐢 신중형', `한 수 평균 ${t.toFixed(1)}초`] : ['⏱️ 보통 속도', `한 수 평균 ${t.toFixed(1)}초`]; },
  profile(g, a) {
    const chips = [], ev = [];
    if (g === 'janggi' || g === 'chess') {
      const aggr = a.moves ? (a.caps + a.checks) / a.moves : 0, adv = a.moves ? a.adv / a.moves : 0;
      chips.push(aggr >= 0.22 || adv >= 0.45 ? '⚔️ 공격형' : aggr <= 0.1 && adv < 0.3 ? '🛡️ 수비형' : '⚖️ 균형형');
      ev.push(`잡기·${g === 'janggi' ? '장군' : '체크'} ${Math.round(aggr * 100)}% · 전진 ${Math.round(adv * 100)}%`);
      const sp = this.speed(a); chips.push(sp[0]); ev.push(sp[1]);
      const fav = this.top(a.use, g === 'janggi' ? { 4: '마', 5: '차', 6: '포', 3: '상', 7: '졸' } : { 2: '나이트', 3: '비숍', 4: '룩', 5: '퀸', 1: '폰' });
      if (fav) chips.push(`❤️ ${fav} 애용`);
      if (g === 'janggi') { const p = this.top(a.pat, { '마상마상': '마상마상', '상마상마': '상마상마', '마상상마': '마상상마', '상마마상': '상마마상' }); if (p) ev.push(`자주 쓰는 상차림: ${p}`); }
      if (g === 'chess') {
        if (a.castled) ev.push(`캐슬링 ${a.castled}/${a.games}판 · 평균 ${Math.round(a.castleMove / a.castled)}수째`); else ev.push('아직 캐슬링을 한 판이 없어요');
        if (a.earlyQ / a.games >= 0.5) chips.push('👑 퀸 조기 출동');
      }
    } else if (g === 'go') {
      const contact = a.moves ? a.contact / a.moves : 0;
      chips.push(contact >= 0.5 ? '🔥 싸움형' : contact <= 0.3 ? '🌿 평화형' : '⚖️ 균형형');
      ev.push(`상대 돌에 붙여 두는 비율 ${Math.round(contact * 100)}%`);
      if (a.l3 + a.l4 >= 5) { chips.push(a.l4 > a.l3 ? '🏯 세력형' : '💰 실리형'); ev.push(`초반 3선 ${a.l3} · 4선 ${a.l4}`); }
      const sp = this.speed(a); chips.push(sp[0]); ev.push(sp[1]);
    } else {
      const memo = a.inputs ? a.memo / a.inputs : 0, mis = a.games ? a.mistakes / a.games : 0;
      chips.push(memo >= 0.2 ? '✏️ 메모 활용형' : '🧠 암산형');
      chips.push(mis <= 1 ? '🎯 정확형' : mis >= 4 ? '🏃 빠른 시도형' : '⚖️ 보통');
      ev.push(`메모 사용 ${Math.round(memo * 100)}% · 판당 실수 ${mis.toFixed(1)}개 · 평균 ${Math.round((a.sec || 0) / a.games / 60)}분`);
    }
    if (a.warns) { const h = a.heeded / a.warns; chips.push(h >= 0.7 ? '👀 위험 감지 우수' : h < 0.4 ? '🎲 과감한 선택' : '🙂 경고 반반'); ev.push(`코치 경고 ${a.warns}번 중 ${a.heeded}번 다시 생각`); }
    if (a.games && a.hints / a.games >= 3) chips.push('💡 힌트 활용형');
    return { chips, ev };
  },
  card(g, u) {
    const a = u.style[g];
    const head = `<h4>${GAME_ICON[g]} ${GAME_NAME[g]}</h4>`;
    if (!a || a.games < this.MIN) {
      const n = a ? a.games : 0;
      return `<div class="scard">${head}<div style="color:var(--sub)">${mn('train')}·${mn('match')} 모드로 <b>${this.MIN - n}판</b> 더 하면 분석돼요</div><div class="pbar" style="width:100%;margin-top:8px"><i style="width:${n / this.MIN * 100}%"></i></div></div>`;
    }
    const p = this.profile(g, a);
    return `<div class="scard">${head}<div>${p.chips.map(c => `<span class="chip">${c}</span>`).join('')}</div><div class="ev">${p.ev.join('<br>')}<br>근거: ${a.games}판 · ${a.moves || a.inputs || 0}${g === 'sudoku' ? '번 입력' : '수'}</div></div>`;
  }
};
// 사람 수 기록 공통
function stNew(extra) { return Object.assign({ moves: 0, caps: 0, checks: 0, adv: 0, think: 0, thinkN: 0, warns: 0, heeded: 0, hints: 0, use: {} }, extra || {}); }
function stThink(G) { if (G.turnT) { const t = (Date.now() - G.turnT) / 1000; if (t < 120) { G.st.think += t; G.st.thinkN++; } } }

// ---------- 피드백 ----------
const Feedback = {
  pick(a) { return a[Math.floor(Math.random() * a.length)]; },
  make(game, mode, result, reason, fb, nextTrain) {
    if (isKid()) return this.kid(game, mode, result, fb, nextTrain);
    if (game === 'sudoku') return this.sudoku(mode, result, fb, nextTrain);
    const lines = [], n = fb.moves || 0, lv = Shell.opts.level;
    if (/기권/.test(reason) && result === 'loss') lines.push(`${n}수에서 기권했어요. 어디서 흐름이 기울었는지 짚어볼게요.`);
    else if (result === 'win') lines.push(this.pick([`${n}수 만에 AI Lv.${lv}을 꺾었어요. 흐름을 끝까지 놓치지 않았어요.`, `깔끔한 승리예요. 결정적인 순간을 잘 잡아냈어요.`]));
    else if (result === 'loss') lines.push(this.pick([`${n}수 대국이었어요. 한 번의 흔들림이 크게 이어졌어요.`, `아쉬운 패배예요. 흐름이 기울어진 지점을 짚어볼게요.`]));
    else lines.push(`비긴 판이에요. ${n}수 동안 팽팽하게 맞섰어요.`);
    const ul = [];
    const bl = (fb.blunders || []).slice().sort((a, b) => b.drop - a.drop);
    if (bl.length) {
      ul.push(`<b>결정적 장면</b>: ${bl[0].no}수째 ${bl[0].text}`);
      if (bl.length >= 3) ul.push(`형세가 크게 흔들린 수가 <b>${bl.length}번</b> 있었어요. 두기 전에 상대가 바로 잡을 수 있는 기물이 없는지 한 번 더 확인해 보세요.`);
    } else if (result !== 'win' && n > 10) ul.push('눈에 띄는 큰 실수 없이 조금씩 밀렸어요.');
    else if (result === 'win' && n > 10) ul.push('큰 실수 없이 안정적으로 운영했어요.');
    if (fb.best) ul.push(`<b>좋았던 수</b>: ${fb.best.no}수째 ${fb.best.text}`);
    (fb.extra || []).forEach(x => ul.push(x));
    if (mode === 'train') {
      const parts = [];
      if (fb.hints) parts.push(`힌트 <b>${fb.hints}번</b>`);
      if (fb.warns) parts.push(`코치 경고 <b>${fb.warns}번</b> (그중 ${fb.heeded || 0}번은 다시 생각했어요)`);
      if (fb.undos) parts.push(`무르기 <b>${fb.undos}번</b>`);
      if (parts.length) ul.push('이번 판에서 쓴 도움: ' + parts.join(' · '));
      if (fb.warns && fb.heeded === fb.warns) ul.push('코치 경고를 모두 받아들였어요. 위험을 알아차리는 눈이 생기고 있어요 👀');
      else if (fb.warns >= 2 && (fb.heeded || 0) < fb.warns / 2) ul.push('경고를 무시하고 둔 수가 많았어요. 경고가 뜨면 상대가 무엇을 잡을 수 있는지 먼저 살펴보세요.');
      if (fb.lvPath && fb.lvPath.length > 1) ul.push(`<b>이번 판 AI 레벨 변화</b>: ${fb.lvPath.map(x => 'Lv.' + x).join(' → ')}`);
      if (fb.quality) { const q = fb.quality; ul.push(`<b>내 수 분석</b>: 좋은 수 ${q.good} · 보통 ${q.ok} · 아쉬운 수 ${q.slip} · 큰 실수 ${q.blunder}`); }
      ul.push(`<b>다음 ${mn('train')} 시작 레벨</b>: Lv.${nextTrain}`);
    }
    const tip = this.tip(game, result, reason);
    if (tip) ul.push(`<b>다음 판 팁</b>: ${tip}`);
    return `<div>${lines.join(' ')}</div><ul>${ul.map(x => `<li>${x}</li>`).join('')}</ul>`;
  },
  kid(game, mode, result, fb, nextTrain) {
    let stars = result === 'win' ? 3 : result === 'draw' ? 2 : 1;
    if (result === 'win' && (fb.hints || 0) > 2) stars = 2;
    const head = result === 'win' ? this.pick(['정말 잘했어! 최고야! 🎉', '멋지게 이겼어! 👏', '와, 대단해! 🌟'])
      : result === 'draw' ? '비겼어! 팽팽한 승부였어 🤝' : this.pick(['괜찮아! 다음엔 더 잘할 수 있어 💪', '아깝다! 한 번 더 해볼까? 😊']);
    const ul = [];
    const q = fb.quality;
    if (q && q.good) ul.push(`좋은 수를 <b>${q.good}번</b>이나 뒀어! ⭐`);
    if (fb.heeded) ul.push(`선생님 말을 듣고 <b>${fb.heeded}번</b> 다시 생각했어. 훌륭해! 👀`);
    if (game === 'sudoku' && result === 'win') ul.push(fb.mistakes ? `틀린 숫자 ${fb.mistakes}개를 고치면서 끝까지 해냈어!` : '하나도 안 틀리고 다 맞혔어!');
    if (fb.lvPath && fb.lvPath.length > 1 && fb.lvPath[fb.lvPath.length - 1] > fb.lvPath[0]) ul.push('네가 잘해서 AI가 점점 세졌어! 🔥');

function confetti() {
  const c = $('confetti'), x = c.getContext('2d');

  const cols = ['#e0a84a', '#2fbf71', '#3b82f6', '#ef4444', '#f5f5f5', '#a855f7'];
  const ps = Array.from({ length: 160 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4, r: Math.random() * 6.28, vr: (Math.random() - .5) * .3, s: 5 + Math.random() * 6, c: cols[(Math.random() * cols.length) | 0] }));
  let f = 0;
  (function step() {
    x.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += p.vr; p.vy += .03; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); });
    if (++f < 220) requestAnimationFrame(step); else { c.classList.add('hidden'); x.clearRect(0, 0, c.width, c.height); }
  })();
}

      else { const seen = new Set(); G.geo.peers[st.cell].forEach(p => { if (G.val[p]) seen.add(G.val[p]); }); why = `이 칸의 가로줄·세로줄·상자에 이미 ${[...seen].sort().join(', ')}이(가) 있어서 남은 숫자는 ${st.val}뿐이에요.`; }
      hs.stage = 2; hs.cell = st.cell; G.sel = st.cell;
      Shell.coach(`<b>힌트 2/3 · 이 칸이에요</b><br>진한 초록 칸! ${why}`);
    } else if (hs.stage === 2 && hs.st) {
      G.sel = hs.st.cell; const v = hs.st.val; G.hintState = null; G.memoMode = false; paintTog();
      Shell.coach(`<b>힌트 3/3</b> · ${v}을(를) 채웠어요.`); input(v); return;
    }
    render();
  }
  function unitName(ui) { const n = G.n; return ui < n ? `${ui + 1}번째 가로줄` : ui < 2 * n ? `${ui - n + 1}번째 세로줄` : `${ui - 2 * n + 1}번째 상자`; }
  async function giveUp() {
    if (!G || G.over) return;
    const myG = G;
    if (!(await Modal.ask('포기할까요?', '정답을 보여주고 "포기"로 기록돼요.', '포기하기', true)) || myG !== G || G.over) return;
    const filled = G.val.filter((v, i) => !G.given[i] && v === G.sol[i]).length, total = G.given.filter(x => !x).length;
    G.reveal = true; G.val = G.sol.slice(); finish(false, filled, total);
  }
  function finish(ok, filled, total) {
    G.over = true; clearInterval(timer); G.sel = -1; G.hintState = null; render(); update();
    if (G.mode === 'tutorial') { Tutorial.pass('sudoku', G.o.lesson, `모든 칸을 맞게 채웠어요! (실수 ${G.mistakes}번 · 힌트 ${G.hints}번)`); return; }
    const s = secs(), t = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    Object.assign(G.st, { mistakes: G.mistakes, sec: s, hints: G.hints });
    Shell.finish(ok ? 'win' : 'loss', ok ? `완성 ${t}` : `포기 (${t})`, { style: G.st, moves: 0, sec: s, hints: G.hints, mistakes: G.mistakes, techName: SE.TECH[G.tech] || '고급 기술', hintTechs: G.hintTechs, n: G.n, filled, total });
  }
  function update() {
    if (!G) return;
    if (G.over) Shell.status(G.reveal ? '정답 공개' : '🎉 완성!');
    else Shell.status(G.memoMode ? '✏️ 메모 모드 — 후보 숫자를 적어요' : (G.mode === 'tutorial' ? '👉 파란 테두리 칸을 채워 보세요' : '👉 빈칸을 채워 보세요'), 'me');
    $('sdMis').textContent = G.check ? `실수 ${G.mistakes}` : '';
    $('sdUndo').disabled = G.over || !G.undo.length;
    if ($('sdHint')) $('sdHint').disabled = G.over;
    if ($('sdGive')) $('sdGive').disabled = G.over;
    const cnt = new Array(G.n + 1).fill(0); G.val.forEach((v, i) => { if (v && v === G.sol[i]) cnt[v]++; });
    document.querySelectorAll('#sdPad button').forEach(b => { const d = +b.dataset.n; b.classList.toggle('done', d > 0 && cnt[d] >= G.n); });
  }
  function render() {
    if (!G) return;
    const n = G.n, geo = G.geo, grid = $('sgrid'); if (!grid) return;
    const px = Math.min(boardPx(1), n <= 6 ? 480 : 640), cell = Math.floor((px - 8) / n);
    grid.style.gridTemplateColumns = `repeat(${n}, ${cell}px)`;
    const selV = G.sel >= 0 ? G.val[G.sel] : 0, peers = G.sel >= 0 ? new Set(geo.peers[G.sel]) : new Set();
    const hs = G.hintState, area = hs && hs.stage === 1 ? new Set(hs.area) : null, hcell = hs && hs.stage === 2 ? hs.cell : -1;
    const tg = new Set(G.targets);
    let h = '';
    for (let i = 0; i < n * n; i++) {
      const r = Math.floor(i / n), c = i % n, v = G.val[i], cls = ['scell'];
      if (G.given[i]) cls.push('given'); else if (v) cls.push('user');
      if (peers.has(i)) cls.push('peer');
      if (selV && v === selV && i !== G.sel) cls.push('same');
      if (i === G.sel) cls.push('sel');
      if (v && !G.given[i] && v !== G.sol[i] && (G.check || i === hcell)) cls.push('bad');
      if (area && area.has(i)) cls.push('hintu');
      if (i === hcell) cls.push('hintc');
      if (tg.has(i) && !G.over) cls.push('target');
      if (i === G.popCell) cls.push('pop');
      const bt = r % geo.br === 0 ? 3 : 1, bl = c % geo.bc === 0 ? 3 : 1, bb = r === n - 1 ? 3 : 0, br = c === n - 1 ? 3 : 0;
      const style = `width:${cell}px;height:${cell}px;font-size:${Math.floor(cell * .56)}px;border-top:${bt}px solid #2b3140;border-left:${bl}px solid #2b3140;border-bottom:${bb}px solid #2b3140;border-right:${br}px solid #2b3140;`;
      let inner = v ? v : '';
      if (!v && G.memo[i]) {
        const cols = n === 4 ? 2 : 3;
        inner = `<div class="memo" style="grid-template-columns:repeat(${cols},1fr);font-size:${Math.max(9, Math.floor(cell / (cols + 1.6)))}px">` + Array.from({ length: n }, (_, k) => `<span>${G.memo[i] & (1 << (k + 1)) ? k + 1 : ''}</span>`).join('') + '</div>';
      }
      h += `<div class="${cls.join(' ')}" data-i="${i}" style="${style}">${inner}</div>`;
    }
    grid.innerHTML = h; G.popCell = -1;
  }
  return { start, destroy, moveCount: () => G ? G.undo.length : 0, _g: () => G };
})();

App.init();

</script>
